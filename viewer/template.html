<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#f3f5f9; --panel:rgba(255,255,255,.92); --ink:#0f172a; --sub:#475569; --line:#cbd5e1; --accent:#2563eb; }
  [data-theme="dark"] { --bg:#0b1220; --panel:rgba(15,23,42,.92); --ink:#e2e8f0; --sub:#94a3b8; --line:#334155; --accent:#60a5fa; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:13px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; overflow:hidden; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; touch-action:none; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 4px 18px rgba(15,23,42,.12); backdrop-filter:blur(6px); padding:12px 14px; }
  #info { top:14px; left:14px; width:262px; max-height:calc(100% - 28px); overflow:auto; }
  #info h1 { font-size:16px; margin:0 0 2px; }
  #info .sub { color:var(--sub); margin:0 0 10px; }
  #info h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--sub); margin:12px 0 6px; }
  .layer { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; user-select:none; }
  .layer input { margin:0; accent-color:var(--accent); }
  .dot { width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.2); flex:none; }
  .row { display:flex; align-items:center; gap:8px; }
  .row input[type=range] { flex:1; accent-color:var(--accent); }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  button { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px;
    padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { color:#fff; filter:brightness(1.1); }
  #legend { right:14px; bottom:14px; min-width:150px; }
  #legend .item { display:flex; align-items:center; gap:8px; padding:2px 0; }
  #legend .swatch { width:26px; height:0; border-top:3px solid; }
  #legend .swatch.dashed { border-top-style:dashed; }
  #tip { position:fixed; display:none; pointer-events:none; max-width:300px; z-index:5; }
  #tip b { display:block; font-size:14px; }
  #tip .meta { color:var(--sub); margin-bottom:4px; }
  #tip ul { margin:4px 0 0; padding-left:16px; }
  #warn { color:#b45309; font-size:12px; margin-top:8px; white-space:pre-wrap; }
  #hint { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); color:var(--sub); font-size:12px; pointer-events:none; }
  body.clean .panel, body.clean #hint { display:none; }
</style>
<script type="importmap">
__IMPORTMAP__
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>

<div id="info" class="panel">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <h2>Layers</h2>
  <div id="layers"></div>
  <h2>View</h2>
  <div class="row"><span>Explode</span><input id="explode" type="range" min="0.5" max="2" step="0.05" value="1"></div>
  <div class="btns">
    <button id="reset">Reset view</button>
    <button id="labels">Labels</button>
    <button id="vlinks">Runs-on links</button>
    <button id="theme">Theme</button>
    <button id="png" class="primary">Export PNG</button>
  </div>
  <div id="warn"></div>
</div>

<div id="legend" class="panel"></div>
<div id="tip" class="panel"></div>
<div id="hint">drag = rotate · right-drag = pan · wheel = zoom · hover/click a node to trace its links</div>

<script type="application/json" id="scene">__SCENE__</script>
<script type="module">
__VIEWER__
</script>
</body>
</html>
